<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The Lilo tech stack</title>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14a3fa"/><stop offset="1" stop-color="#0d4ff0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#f6f7fb"/>

  <!-- Renderer -->
  <text x="40" y="70" font-size="11" font-weight="600" letter-spacing="2" fill="#6b7288">RENDERER</text>
  <text x="40" y="96" font-size="15" fill="#4b5368">What the student sees.</text>
  <text x="40" y="116" font-size="15" fill="#4b5368">Sandboxed, no Node in it.</text>
  <g>
    <rect x="316" y="48" width="808" height="88" rx="10" fill="#ffffff" stroke="#d7dbe6"/>
    <rect x="316" y="48" width="808" height="4" rx="2" fill="url(#blue)"/>
    <text x="336" y="82" font-size="16" font-weight="600" fill="#171f33">React 19, TypeScript 5.9, Tailwind 4, zustand 5</text>
    <text x="336" y="106" font-size="13" fill="#4b5368">Two pages: the orb and the panel, and the preferences window. The orb and the menu bar mark are drawn in code, no image assets.</text>
    <text x="336" y="124" font-size="13" fill="#4b5368">System fonts only: the app in the system sans, quoted postings in the platform's own serif.</text>
  </g>

  <!-- Preload -->
  <text x="40" y="184" font-size="11" font-weight="600" letter-spacing="2" fill="#6b7288">PRELOAD</text>
  <text x="40" y="210" font-size="15" fill="#4b5368">The one door.</text>
  <g>
    <rect x="316" y="162" width="808" height="60" rx="10" fill="#ffffff" stroke="#d7dbe6"/>
    <text x="336" y="188" font-size="16" font-weight="600" fill="#171f33">Electron contextBridge</text>
    <text x="336" y="208" font-size="13" fill="#4b5368">Exposes exactly the channels named in one shared file. Every point and string a renderer sends is checked in main before it reaches a window.</text>
  </g>

  <!-- Main -->
  <text x="40" y="270" font-size="11" font-weight="600" letter-spacing="2" fill="#6b7288">MAIN PROCESS</text>
  <text x="40" y="296" font-size="15" fill="#4b5368">All the thinking. The only</text>
  <text x="40" y="316" font-size="15" fill="#4b5368">process that reaches the disk,</text>
  <text x="40" y="336" font-size="15" fill="#4b5368">the network or your keys.</text>
  <rect x="316" y="248" width="808" height="216" rx="12" fill="#eef1f8" stroke="#c9cfdf"/>
  <text x="336" y="276" font-size="16" font-weight="600" fill="#171f33">Electron 44 on Node 22</text>
  <g>
    <rect x="336" y="292" width="252" height="152" rx="10" fill="#ffffff" stroke="#d7dbe6"/>
    <text x="352" y="318" font-size="14" font-weight="600" fill="#171f33">Models</text>
    <text x="352" y="340" font-size="13" fill="#4b5368">openai 7 and @anthropic-ai/sdk</text>
    <text x="352" y="358" font-size="13" fill="#4b5368">One queue, a backoff, and zod 4</text>
    <text x="352" y="376" font-size="13" fill="#4b5368">over every structured reply.</text>
    <text x="352" y="394" font-size="13" fill="#4b5368">Protocol decided from the address:</text>
    <text x="352" y="412" font-size="13" fill="#4b5368">Anthropic messages, or OpenAI chat</text>
    <text x="352" y="430" font-size="13" fill="#4b5368">for everything else.</text>
  </g>
  <g>
    <rect x="604" y="292" width="252" height="152" rx="10" fill="#ffffff" stroke="#d7dbe6"/>
    <text x="620" y="318" font-size="14" font-weight="600" fill="#171f33">Evidence and lectures</text>
    <text x="620" y="340" font-size="13" fill="#4b5368">MiniSearch 7 over the tagged</text>
    <text x="620" y="358" font-size="13" fill="#4b5368">sentences, exact index first.</text>
    <text x="620" y="376" font-size="13" fill="#4b5368">unpdf reads PDFs, jszip reads</text>
    <text x="620" y="394" font-size="13" fill="#4b5368">PowerPoint. Text, Markdown and</text>
    <text x="620" y="412" font-size="13" fill="#4b5368">WebVTT read as they are.</text>
  </g>
  <g>
    <rect x="872" y="292" width="232" height="152" rx="10" fill="#ffffff" stroke="#d7dbe6"/>
    <text x="888" y="318" font-size="14" font-weight="600" fill="#171f33">Settings and voice</text>
    <text x="888" y="340" font-size="13" fill="#4b5368">electron-store, layered over</text>
    <text x="888" y="358" font-size="13" fill="#4b5368">dotenv. Keys sealed with</text>
    <text x="888" y="376" font-size="13" fill="#4b5368">safeStorage: Keychain on</text>
    <text x="888" y="394" font-size="13" fill="#4b5368">macOS, DPAPI on Windows.</text>
    <text x="888" y="412" font-size="13" fill="#4b5368">Speech as 16 kHz WAV to any</text>
    <text x="888" y="430" font-size="13" fill="#4b5368">whisper-style endpoint.</text>
  </g>

  <!-- Outside the app -->
  <text x="40" y="512" font-size="11" font-weight="600" letter-spacing="2" fill="#6b7288">BESIDE THE APP</text>
  <text x="40" y="538" font-size="15" fill="#4b5368">Nothing bundled points at</text>
  <text x="40" y="558" font-size="15" fill="#4b5368">anybody's service by default.</text>
  <g>
    <rect x="316" y="490" width="252" height="112" rx="10" fill="#ffffff" stroke="#d7dbe6"/>
    <text x="332" y="516" font-size="14" font-weight="600" fill="#171f33">Chrome</text>
    <text x="332" y="538" font-size="13" fill="#4b5368">A Manifest V3 extension, three</text>
    <text x="332" y="556" font-size="13" fill="#4b5368">plain files, and a native messaging</text>
    <text x="332" y="574" font-size="13" fill="#4b5368">host: Lilo's own binary as plain</text>
    <text x="332" y="592" font-size="13" fill="#4b5368">Node, over a local socket.</text>
  </g>
  <g>
    <rect x="584" y="490" width="252" height="112" rx="10" fill="#ffffff" stroke="#d7dbe6"/>
    <text x="600" y="516" font-size="14" font-weight="600" fill="#171f33">A model, yours</text>
    <text x="600" y="538" font-size="13" fill="#4b5368">Any OpenAI-compatible endpoint:</text>
    <text x="600" y="556" font-size="13" fill="#4b5368">OpenRouter, Groq, Featherless,</text>
    <text x="600" y="574" font-size="13" fill="#4b5368">vLLM, LM Studio, Ollama on this</text>
    <text x="600" y="592" font-size="13" fill="#4b5368">machine. Or api.anthropic.com.</text>
  </g>
  <g>
    <rect x="852" y="490" width="272" height="112" rx="10" fill="#fbf6ec" stroke="#e4d9c3"/>
    <text x="868" y="516" font-size="14" font-weight="600" font-family="ui-serif, 'New York', Georgia, serif" fill="#171f33">Public sources</text>
    <text x="868" y="538" font-size="13" fill="#4b5368">30 Greenhouse and Lever boards,</text>
    <text x="868" y="556" font-size="13" fill="#4b5368">the endpoints the careers pages</text>
    <text x="868" y="574" font-size="13" fill="#4b5368">call. LeetCode's interview board</text>
    <text x="868" y="592" font-size="13" fill="#4b5368">and Hacker News for write-ups.</text>
  </g>

  <!-- Tooling -->
  <text x="40" y="660" font-size="11" font-weight="600" letter-spacing="2" fill="#6b7288">BUILD AND CHECK</text>
  <text x="40" y="686" font-size="15" fill="#4b5368">Both platforms, every push.</text>
  <g>
    <rect x="316" y="636" width="808" height="80" rx="10" fill="#ffffff" stroke="#d7dbe6"/>
    <text x="336" y="662" font-size="16" font-weight="600" fill="#171f33">electron-vite 5, node --test, electron-builder 26, GitHub Actions</text>
    <text x="336" y="684" font-size="13" fill="#4b5368">288 tests load the TypeScript directly with no build step. CI runs typecheck and tests, then packages a DMG and an NSIS installer.</text>
    <text x="336" y="702" font-size="13" fill="#4b5368">Unsigned, per-user installs. The evidence base, the extension and the host ship beside the app, outside the asar.</text>
  </g>
</svg>
