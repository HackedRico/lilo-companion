appId: com.lilo.companion
productName: Lilo
directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# The evidence base is read from disk at runtime rather than bundled into the
# main process, so it stays a file you can regenerate without a rebuild.
extraResources:
  - from: data
    to: data
    filter:
      - '**/*'
  # The Chrome extension is loaded unpacked from here, and the native host
  # runs from here as plain Node, so neither can live inside the asar.
  - from: extension
    to: extension
    filter:
      - '**/*'
  - from: out/main/host.js
    to: host.js

mac:
  category: public.app-category.education
  # A signed build runs hardened; the entitlements say what Electron needs under it.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  extendInfo:
    # A menu bar companion, not a Dock app.
    LSUIElement: true

win:
  target:
    - nsis

linux:
  target:
    - AppImage
  category: Education
